version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        # Amplify only exposes console env vars to the build. Persist the ones the
        # SSR runtime needs into .env.production so route handlers can read them.
        - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_|S3_|JUDGE0_|COMPILE_|ADMIN_EMAILS)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
