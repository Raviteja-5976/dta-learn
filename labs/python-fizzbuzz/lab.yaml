apiVersion: labs/v1
kind: Lab
metadata:
  slug: python-fizzbuzz
  title: FizzBuzz
  description: The classic warm-up — loops, conditions and the modulo operator.
  tags: [python]
  difficulty: beginner
  estimatedMinutes: 10
runtime:
  type: compile
  language: python3
  limits: { cpuSeconds: 2, wallSeconds: 5, memoryMiB: 256 }
files:
  - path: main.py
    main: true
    content: |
      n = int(input())

      for i in range(1, n + 1):
          # Print "Fizz" for multiples of 3, "Buzz" for multiples of 5,
          # "FizzBuzz" for multiples of both, and the number otherwise.
          print(i)
ui:
  layout: editor-output
steps:
  - id: fizzbuzz
    title: Print FizzBuzz from 1 to n
    instructions: |
      Read a number **n** from standard input and print one line for each
      number from 1 to n:

      - `FizzBuzz` if the number is divisible by 3 **and** 5
      - `Fizz` if it is divisible by 3
      - `Buzz` if it is divisible by 5
      - the number itself otherwise

      Press **Run** to try your code with the stdin box, then **Check** to run
      the hidden tests.
    checks:
      - type: program.io
        compare: { trim: lines, ordered: true }
        cases:
          - name: sample
            stdin: "5\n"
            stdout: "1\n2\nFizz\n4\nBuzz\n"
          - name: fifteen
            stdin: "15\n"
            stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n"
          - name: one
            stdin: "1\n"
            stdout: "1\n"
            hidden: true
          - name: thirty
            stdin: "30\n"
            stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16\n17\nFizz\n19\nBuzz\nFizz\n22\n23\nFizz\nBuzz\n26\nFizz\n28\n29\nFizzBuzz\n"
            hidden: true
    hints:
      - "`i % 3 == 0` is true when i is divisible by 3."
      - "Check the FizzBuzz case (divisible by 15) **first**, before Fizz and Buzz."
solution:
  main.py: |
    n = int(input())
    for i in range(1, n + 1):
        if i % 15 == 0:
            print("FizzBuzz")
        elif i % 3 == 0:
            print("Fizz")
        elif i % 5 == 0:
            print("Buzz")
        else:
            print(i)
